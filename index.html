<title>Evo HUD</title>
<style>
html, body { margin:0; height:100%; background:#00050a; color:#ccffff; }
/* HUD de voz de Evo. Clon del HUD de Jarvis (jarvis/ui/static/style.css):
   mismos tokens, mismas medidas y animaciones. Todo va acotado a `.evo-hud`
   para no tocar el resto de la SPA, que sigue con su tema claro. Los
   keyframes y los anillos llevan prefijo `hud-` porque Tailwind ya define
   `spin`, `ping` y la utilidad `ring` (un box-shadow azul). */
.evo-hud {
  --bg: #00050a;
  --cyan: #00ddff;
  --cyan-40: rgba(0, 221, 255, .4);
  --cyan-20: rgba(0, 221, 255, .2);
  --cyan-10: rgba(0, 221, 255, .1);
  --cyan-05: rgba(0, 221, 255, .05);
  --panel: rgba(0, 5, 10, .4);
  --text: #ccffff;
  --amber: #ff8c00;
  --danger: #ff0000;
  --ok: #00ddff;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;

  position: fixed; inset: 0; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%, rgba(0, 130, 160, .10), transparent 70%),
    var(--bg);
  color: var(--text);
  font: 13px/1.5 var(--mono);
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
  color-scheme: dark;
}
.evo-hud *, .evo-hud *::before, .evo-hud *::after { box-sizing: border-box; }
.evo-hud button { font-family: var(--mono); }
.evo-hud :focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }

/* ============================================ CRT: scanline + trama */
.evo-hud .crt { position: absolute; inset: 0; pointer-events: none; z-index: 100; }
.evo-hud .crt::after {
  content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, .10) 50%),
    linear-gradient(90deg, rgba(255, 0, 0, .03), rgba(0, 255, 0, .01), rgba(0, 0, 255, .03));
  background-size: 100% 2px, 3px 100%;
}
.evo-hud .crt .scanline {
  position: absolute; left: 0; right: 0; height: 90px;
  background: linear-gradient(180deg, transparent, rgba(0, 229, 255, .045), transparent);
  animation: hud-scan 7s linear infinite;
}
@keyframes hud-scan { from { top: -90px; } to { top: 100%; } }

/* ============================================ HEADER */
.evo-hud .topbar {
  height: 64px; flex-shrink: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px; gap: 20px;
  border-bottom: 1px solid var(--cyan-20);
  background: var(--panel); backdrop-filter: blur(10px);
}
.evo-hud .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
.evo-hud .brand-ring {
  width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center;
  color: var(--cyan); border: 1px solid var(--cyan-40);
  box-shadow: inset 0 0 12px var(--cyan-10), 0 0 14px var(--cyan-10);
  animation: hud-breathe 4s ease-in-out infinite;
}
.evo-hud .brand-name { font-size: 14px; font-weight: 700; letter-spacing: .22em; color: var(--cyan); margin: 0; }
.evo-hud .brand-sub { font-size: 9px; letter-spacing: .12em; color: var(--cyan-40); margin: 1px 0 0; }

.evo-hud .head-metrics { display: flex; align-items: center; gap: 34px; }
.evo-hud .hm { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.evo-hud .hm-label { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan-40); }
.evo-hud .hm-value { font-size: 12px; font-weight: 700; color: var(--cyan); display: flex; align-items: center; gap: 7px; }
.evo-hud .hm-value.tab { font-variant-numeric: tabular-nums; }
.evo-hud .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger);
  box-shadow: 0 0 8px currentColor; transition: background .3s; }
.evo-hud .status-dot.ok { background: var(--cyan); animation: hud-dot-blink 2.4s ease-in-out infinite; }
.evo-hud .status-dot.warn { background: var(--amber); }

.evo-hud .head-actions { display: flex; align-items: center; gap: 14px; }
.evo-hud .head-sep { width: 1px; height: 24px; background: var(--cyan-20); }
.evo-hud .operator { display: flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 700;
  letter-spacing: .08em; color: var(--cyan); }
.evo-hud .operator .avatar { width: 30px; height: 30px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--cyan-40), var(--cyan-10) 70%);
  border: 1px solid var(--cyan-40); }

.evo-hud .listen-pill {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none;
  padding: 7px 14px; border-radius: 4px;
  font-size: 10px; font-weight: 700; letter-spacing: .14em;
  color: var(--cyan); border: 1px solid var(--cyan-40);
  background: var(--cyan-05);
  transition: color .2s, border-color .2s, box-shadow .2s, transform .1s;
}
.evo-hud .listen-pill:active { transform: scale(.97); }
.evo-hud .listen-pill .pdot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.evo-hud .listen-pill.state-listening .pdot { animation: hud-dot-blink 1.6s ease-in-out infinite; }
.evo-hud .listen-pill.state-recording { box-shadow: 0 0 16px var(--cyan-20); }
.evo-hud .listen-pill.state-thinking { color: var(--amber); border-color: rgba(255, 181, 69, .5); }
.evo-hud .listen-pill.state-speaking { box-shadow: 0 0 16px var(--cyan-20); }
.evo-hud .listen-pill.state-speaking .pdot { animation: hud-dot-blink .8s ease-in-out infinite; }
.evo-hud .listen-pill.muted { color: var(--danger); border-color: rgba(255, 93, 108, .55); }
.evo-hud .listen-pill.stop { color: var(--amber); border-color: rgba(255, 181, 69, .5);
  background: rgba(255, 181, 69, .05); }
.evo-hud .listen-pill.stop:hover { box-shadow: 0 0 14px rgba(255, 181, 69, .25); }
.evo-hud .listen-pill .pdot.square { border-radius: 1px; }
.evo-hud .listen-pill:disabled { opacity: .45; cursor: default; }
@keyframes hud-dot-blink { 0%, 100% { opacity: .95; } 50% { opacity: .25; } }

/* ============================================ GRID de 3 columnas */
.evo-hud .grid3 { flex: 1; min-height: 0; display: flex; gap: 22px; padding: 22px; }
.evo-hud .col { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.evo-hud .col .grow { flex: 1; min-height: 0; }

.evo-hud .panel {
  position: relative; display: flex; flex-direction: column;
  border: 1px solid var(--cyan-20); background: var(--panel);
  backdrop-filter: blur(10px); padding: 13px 14px 14px;
}
.evo-hud .panel::before, .evo-hud .panel::after {
  content: ""; position: absolute; width: 9px; height: 9px; pointer-events: none;
}
.evo-hud .panel::before { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
.evo-hud .panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

.evo-hud .panel-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  padding-bottom: 9px; margin-bottom: 11px; border-bottom: 1px solid var(--cyan-10);
}
.evo-hud .ph-title { font-size: 10px; letter-spacing: .18em; color: var(--cyan-40); margin: 0; font-weight: 400; }
.evo-hud .ph-title i { font-style: normal; color: var(--cyan-20); }
.evo-hud .ph-title b { color: var(--cyan); }
.evo-hud .ph-tag { font-size: 9px; letter-spacing: .1em; color: var(--cyan-40); font-variant-numeric: tabular-nums;
  max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.evo-hud .ph-dots { position: absolute; top: 5px; right: 6px; display: flex; gap: 3px; }
.evo-hud .ph-dots i { width: 3px; height: 3px; border-radius: 50%; background: var(--cyan-40);
  animation: hud-dot-blink 2.6s ease-in-out infinite; }
.evo-hud .ph-dots i + i { background: var(--cyan-20); animation-delay: 1.3s; }

.evo-hud .panel-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.evo-hud .panel-body.center { align-items: center; justify-content: center; }
.evo-hud .panel-body.log { overflow-y: auto; gap: 6px; }
.evo-hud .hud-empty { color: var(--cyan-40); font-size: 11px; }

/* VOZ */
.evo-hud .metric-row { display: flex; align-items: flex-start; justify-content: space-between; }
.evo-hud .m-label { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan-40); }
.evo-hud .m-big { font-size: 21px; font-weight: 700; color: var(--cyan); letter-spacing: .04em; margin-top: 2px; }
.evo-hud .m-icon { width: 44px; height: 22px; color: var(--cyan-40); }
.evo-hud .m-icon polyline { stroke-dasharray: 60 90; animation: hud-ekg 2.8s linear infinite; }
@keyframes hud-ekg { to { stroke-dashoffset: -150; } }

.evo-hud .vu-box, .evo-hud .vu { display: flex; align-items: flex-end; gap: 3px; height: 34px; }
.evo-hud .vu-box { padding: 6px 8px; border: 1px solid var(--cyan-10); background: var(--cyan-05); }
.evo-hud .vu-box i, .evo-hud .vu i {
  flex: 1; min-width: 3px; background: var(--cyan); opacity: .85;
  height: 12%; transition: height 90ms linear;
  box-shadow: 0 0 6px var(--cyan-20);
}
.evo-hud .vu { height: 26px; width: 130px; }
.evo-hud .vu i { flex: none; width: 4px; }

.evo-hud .tile-row { display: flex; gap: 9px; }
.evo-hud .tile { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--cyan-10); background: var(--cyan-05); }
.evo-hud .tile-v { font-size: 12px; font-weight: 700; color: var(--cyan); margin-top: 3px; letter-spacing: .06em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* CONTEXTO */
.evo-hud .ctx-cards { max-height: min(232px, 26vh); overflow-y: auto; overflow-x: hidden; }
.evo-hud .ctx-row { border-bottom: 1px solid var(--cyan-10); padding: 6px 0 8px; animation: hud-in .35s ease-out; }
.evo-hud .ctx-row:last-child { border-bottom: 0; }
.evo-hud .ctx-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.evo-hud .ctx-title { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan-40); }
.evo-hud .ctx-value { font-size: 15px; font-weight: 700; color: var(--cyan); white-space: nowrap;
  max-width: 175px; overflow: hidden; text-overflow: ellipsis; animation: hud-data-tick .6s ease-out; }
.evo-hud .ctx-detail { font-size: 10px; color: var(--cyan-40); margin-top: 2px; }
.evo-hud .ctx-detail a { color: var(--cyan); text-decoration: none; }
.evo-hud .ctx-detail a:hover { text-decoration: underline; }
@keyframes hud-in { from { opacity: 0; transform: translateX(-8px); } }
@keyframes hud-data-tick { 0% { color: #fff; text-shadow: 0 0 12px var(--cyan); } }

/* RED */
.evo-hud .net-circle {
  position: relative; flex: none; width: 120px; height: 120px; border-radius: 50%;
  border: 1px solid var(--cyan-20); overflow: hidden;
  background: radial-gradient(circle, var(--cyan-05), transparent 70%);
}
.evo-hud .p-red { min-height: 172px; }
.evo-hud .p-red .panel-body { overflow: hidden; }
.evo-hud .net-circle::after { content: ""; position: absolute; inset: 18px; border-radius: 50%;
  border: 1px dashed var(--cyan-20); }
.evo-hud .net-sweep { position: absolute; inset: 0;
  background: conic-gradient(from 0deg, var(--cyan-20), transparent 70deg);
  animation: hud-spin 4s linear infinite; }
.evo-hud .net-ping { position: absolute; inset: 0; border-radius: 50%;
  border: 1px solid var(--cyan-40); pointer-events: none;
  animation: hud-ping 3.2s ease-out infinite; }
.evo-hud .net-circle.down .net-sweep, .evo-hud .net-circle.down .net-ping { animation: none; opacity: .2; }
@keyframes hud-ping { 0% { transform: scale(.25); opacity: .9; } 70%, 100% { transform: scale(1); opacity: 0; } }
.evo-hud .net-label { font-size: 11px; font-weight: 700; letter-spacing: .16em; color: var(--cyan); margin-top: 12px; }
.evo-hud .net-label.down { color: var(--danger); }
.evo-hud .net-sub { font-size: 9px; letter-spacing: .18em; color: var(--cyan-40); margin-top: 3px; }

/* AGENTES */
.evo-hud .bar-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.evo-hud .bar-v { font-size: 17px; font-weight: 700; color: var(--cyan); margin: 2px 0 5px; }
.evo-hud .bar { height: 3px; background: var(--cyan-10); }
.evo-hud .bar-fill { height: 100%; width: 0; background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan-40); transition: width .5s ease; }
.evo-hud .bar-fill.dim { background: var(--cyan-40); }
.evo-hud .agents-list { overflow-y: auto; min-height: 0; }
.evo-hud .hud-agent { position: relative; display: block; width: 100%; text-align: left; background: none; border: 0;
  font-size: 11px; color: var(--cyan-40); padding: 6px 0; border-bottom: 1px solid var(--cyan-10);
  animation: hud-in .35s ease-out; }
.evo-hud .hud-agent:last-child { border-bottom: 0; }
.evo-hud .hud-agent b { color: var(--cyan); }
.evo-hud .task-prog { margin-top: 5px; height: 2px; overflow: hidden; background: var(--cyan-10); }
.evo-hud .task-prog-bar { height: 100%; width: 40%;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  animation: hud-task-indet 1.3s ease-in-out infinite; }
@keyframes hud-task-indet { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
.evo-hud .hud-agent.done { cursor: pointer; transition: color .2s; }
.evo-hud .hud-agent.done:hover, .evo-hud .hud-agent.done:focus-visible { color: var(--cyan); outline: none; }
.evo-hud .hud-agent .task-sello { font-size: 10px; letter-spacing: .08em; }
.evo-hud .hud-agent.ok .task-sello { color: var(--ok); }
.evo-hud .hud-agent.warn .task-sello { color: var(--amber); }
.evo-hud .hud-agent.fail .task-sello { color: var(--danger); }
.evo-hud .hud-agent .task-new { display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; margin-left: 8px; vertical-align: middle;
  background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
  animation: hud-dot-blink 1.6s ease-in-out infinite; }

/* EN VIVO */
.evo-hud .hap { font-size: 10.5px; line-height: 1.5; animation: hud-in .35s ease-out; }
.evo-hud .hap .hap-time { color: var(--cyan-40); margin-right: 6px; }
.evo-hud .hap .hap-title { color: var(--cyan); font-weight: 700; letter-spacing: .02em; }
.evo-hud .hap .hap-detail { color: var(--cyan-40); padding-left: 4px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.evo-hud .hap.warn .hap-title { color: var(--amber); }
.evo-hud .hap.alert .hap-title { color: var(--danger); }

/* TERMINAL: actividad, errores y la línea de orden por texto */
.evo-hud .terminal { border: 1px solid var(--cyan-10); background: rgba(0, 0, 0, .35);
  padding: 9px 11px; min-height: 66px; display: flex; flex-direction: column; gap: 4px; }
.evo-hud .t-line { font-size: 10.5px; color: var(--cyan); overflow-wrap: anywhere; }
.evo-hud .t-line::before { content: "> "; color: var(--cyan-40); }
.evo-hud .t-line.dim { color: var(--cyan-40); font-style: italic; }
.evo-hud .t-line.err { color: var(--danger); }
.evo-hud .t-input { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--cyan-10);
  margin-top: 4px; padding-top: 6px; }
.evo-hud .t-input span { color: var(--cyan-40); font-size: 10.5px; }
.evo-hud .t-input input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
  color: var(--text); font: 10.5px/1.5 var(--mono); caret-color: var(--cyan); }
.evo-hud .t-input input::placeholder { color: var(--cyan-20); }
.evo-hud .t-input input:disabled { opacity: .5; }

/* ============================================ CENTRO: radar + núcleo */
.evo-hud .core-col { position: relative; flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; }
.evo-hud .corner { position: absolute; width: 22px; height: 22px; }
.evo-hud .corner.tl { top: 6px; left: 6px; border-top: 1px solid var(--cyan-40); border-left: 1px solid var(--cyan-40); }
.evo-hud .corner.tr { top: 6px; right: 6px; border-top: 1px solid var(--cyan-40); border-right: 1px solid var(--cyan-40); }
.evo-hud .corner.bl { bottom: 6px; left: 6px; border-bottom: 1px solid var(--cyan-40); border-left: 1px solid var(--cyan-40); }
.evo-hud .corner.br { bottom: 6px; right: 6px; border-bottom: 1px solid var(--cyan-40); border-right: 1px solid var(--cyan-40); }

.evo-hud .core-stage { position: relative; width: min(58vmin, 560px); height: min(58vmin, 560px); }
.evo-hud .orb3d { position: absolute; inset: 0; opacity: .55; }
.evo-hud .core-stage .hud-ring { position: absolute; border-radius: 50%; }
.evo-hud .r-dash { inset: 0; border: 2px dashed var(--cyan-20); animation: hud-spin 60s linear infinite; }
.evo-hud .r-solid { inset: 7%; border: 1px solid var(--cyan-40); }
.evo-hud .r-solid .tick { position: absolute; left: 50%; transform: translateX(-50%);
  width: 26px; height: 5px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan-40); }
.evo-hud .r-solid .t-top { top: -3px; }
.evo-hud .r-solid .t-bot { bottom: -3px; }
.evo-hud .r-inner { inset: 20%; border: 2px solid var(--cyan-20); }
.evo-hud .cross { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--cyan-10); }
.evo-hud .cross.x2 { transform: rotate(60deg); }
.evo-hud .cross.x3 { transform: rotate(-60deg); }
.evo-hud .blip { position: absolute; width: 22px; height: 6px; background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan-40); border-radius: 2px; }
.evo-hud .blip.b1 { top: 24%; right: 17%; transform: rotate(45deg); }
.evo-hud .blip.b2 { bottom: 27%; left: 15%; transform: rotate(45deg); }

.evo-hud .core { position: absolute; inset: 35%; border-radius: 50%;
  border: 1px solid var(--cyan-40); display: grid; place-items: center;
  background: radial-gradient(circle, var(--cyan-10), transparent 75%);
  animation: hud-breathe 3.2s ease-in-out infinite; }
.evo-hud .core-state { font-size: 11px; font-weight: 700; letter-spacing: .2em; text-align: center;
  color: var(--cyan); text-shadow: 0 0 14px var(--cyan-40); line-height: 1.7; }

.evo-hud .core-dock { position: absolute; bottom: 26px; left: 0; right: 0;
  display: flex; flex-direction: column; align-items: center; gap: 12px; }
.evo-hud .cmd-pill { display: inline-flex; align-items: center; gap: 9px;
  padding: 8px 18px; border: 1px solid var(--cyan-40); background: var(--cyan-05);
  border-radius: 4px; color: var(--cyan); cursor: pointer; }
.evo-hud .cmd-label { font-size: 11px; font-weight: 700; letter-spacing: .22em; }
.evo-hud .dock-input { display: none; width: min(420px, 86vw); }

/* ============================================ FOOTER */
.evo-hud .botbar {
  height: 46px; flex-shrink: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px; gap: 16px;
  border-top: 1px solid var(--cyan-20);
  background: var(--panel); backdrop-filter: blur(10px);
  font-size: 9px; letter-spacing: .16em; color: var(--cyan-40);
}
.evo-hud .foot-l { display: flex; gap: 16px; }
.evo-hud .foot-chip { font-weight: 700; }
.evo-hud .foot-chip.on { color: var(--cyan); }
.evo-hud .foot-r { display: flex; align-items: center; gap: 14px; }
.evo-hud .foot-sep { width: 1px; height: 14px; background: var(--cyan-20); }

/* ============================================ escenario: respuesta y entregas */
.evo-hud .stage-overlay { position: absolute; inset: 86px 344px 68px; z-index: 12; }
.evo-hud .stage-body { width: 100%; height: 100%; overflow-y: auto; border: 1px solid var(--cyan-20);
  background: rgba(1, 8, 10, .93); backdrop-filter: blur(6px); padding: 16px 18px;
  font: 12px/1.55 var(--mono); color: var(--text);
  animation: hud-canvas-in .4s cubic-bezier(.2, .8, .2, 1); }
.evo-hud .stage-title { position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
  font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; white-space: nowrap;
  color: var(--cyan); padding: 4px 14px; background: var(--bg); border: 1px solid var(--cyan-40); }
.evo-hud .stage-close { position: absolute; top: 8px; right: 10px; background: none; cursor: pointer;

const visible = id => { const el = document.getElementById(id); if (!el) return null; const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 ? r : null }

function Tour({ start, onClose }) {
  const steps = useRef(TOUR.filter(s => visible(s.target))).current
  const [i, setI] = useState(Math.max(0, steps.findIndex(s => s.target === start)))
  const [rect, setRect] = useState(null)
  const s = steps[i]
  useEffect(() => {
    const measure = () => setRect(s && visible(s.target))
    const el = s && document.getElementById(s.target)
    if (el) el.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })
    measure(); const t = setTimeout(measure, 450)
    addEventListener('resize', measure); addEventListener('scroll', measure, true)
    return () => { clearTimeout(t); removeEventListener('resize', measure); removeEventListener('scroll', measure, true) }
  }, [i])
  useEffect(() => { const k = e => { if (e.key === 'Escape') onClose(); if (e.key === 'ArrowRight' && i < steps.length - 1) setI(i + 1); if (e.key === 'ArrowLeft' && i > 0) setI(i - 1) }; addEventListener('keydown', k); return () => removeEventListener('keydown', k) }, [i])
  if (!s || !rect) return null
  const pad = 6, W = innerWidth, H = innerHeight, cw = Math.min(340, W - 32)
  const below = rect.bottom + 190 < H, right = rect.right + cw + 24 < W
  const side = rect.height > H * .5
  const top = side ? Math.min(Math.max(16, rect.top), H - 220) : below ? rect.bottom + 14 : Math.max(16, rect.top - 14 - 190)
  const left = side ? (right ? rect.right + 14 : Math.max(16, rect.left - cw - 14)) : Math.min(Math.max(16, rect.left), W - cw - 16)
  return <div className="tour" role="dialog" aria-label="Guía de Evo">
    <div className="tour-hole" style={{ top: rect.top - pad, left: rect.left - pad, width: rect.width + pad * 2, height: rect.height + pad * 2 }} />
    <div className="tour-card" style={{ top, left }} aria-live="polite">
      <div className="tour-dots" aria-hidden="true">{steps.map((_, j) => <i key={j} className={j <= i ? 'on' : ''} />)}</div>
      <div className="tc-step"><span>GUÍA · {i + 1} DE {steps.length}</span><span>ESC PARA SALIR</span></div>
      <h3>{s.title}</h3><p>{s.text}</p>
      <div className="tc-actions"><button type="button" className="mini-btn" onClick={onClose}>SALIR</button><span className="grow" />{i > 0 && <button type="button" className="mini-btn" onClick={() => setI(i - 1)}>ATRÁS</button>}<button type="button" className="mini-btn ok" onClick={() => i < steps.length - 1 ? setI(i + 1) : onClose()}>{i < steps.length - 1 ? 'SIGUIENTE' : 'LISTO'}</button></div>
    </div>
  </div>
}

function BoardCard({ b, saved, onSave, onReview }) {

  return <div className="board-card">
    <div className="board-q">» {b.q}</div>
    <div className="board-insight">{b.insight}</div>
    <div className="bchart">{b.rows.map(([k, v, share]) => <React.Fragment key={k}><span className="bl">{k}</span><span className="bt"><i style={{ width: grow ? `${v / max * 100}%` : 0 }} /><u style={{ width: grow ? `${share}%` : 0 }} /></span><span className="bv">{fmtVal(v, b.unit)}</span></React.Fragment>)}</div>
    <div className="board-legend"><span>{b.legend[0]}</span><span className="amb">{b.legend[1]}</span></div>

      {board && <BoardCard b={board} saved={saved.some(x => x.id === board.id)} onSave={() => onSave(board)} onReview={() => { onSave(board); say(`✓ «${board.q}» va a la revisión del lunes`) }} />}
      <h4>MIS TABLEROS · {saved.length}</h4>
      {saved.length === 0 && <div className="board-src">Todavía ninguno. Los que guardes se actualizan solos cada mañana.</div>}
      {saved.map(b => <div className="saved-row" key={b.id} role="button" tabIndex={0} onClick={() => { setMiss(''); setBuilt(-1); setBoard(b) }} onKeyDown={e => e.key === 'Enter' && setBoard(b)}><span className="grow">{b.q}</span><em>SE ACTUALIZA CADA MAÑANA</em></div>)}
      {board && <><h4>OTRAS PREGUNTAS</h4>{BOARDS.filter(b => b.id !== board.id).map(b => <button type="button" key={b.id} className="chip" onClick={() => build(b.q)}>{b.q}</button>)}</>}
    </div>
  </div>
}
function CommandInput({ disabled, placeholder, onSubmit, label }) {
  const [text, setText] = useState('')
  return <form className="t-input" onSubmit={e => { e.preventDefault(); const v = text.trim(); if (!v || disabled) return; onSubmit(v); setText('') }}><span aria-hidden="true">&gt;</span><label className="sr-only" htmlFor={`${label}-input`}>Cuéntale algo a Evo</label><input id={`${label}-input`} value={text} maxLength={400} disabled={disabled} placeholder={placeholder} autoComplete="off" onChange={e => setText(e.target.value)} /></form>
}
function classify(text) {
  const t = text.toLowerCase()
  if (/(no puedo|no me deja|error|mal el|está mal|equivocad|se cayó)/.test(t)) return 'Lo reviso ahora mismo. Si es algo del anuncio, lo corrijo hoy.'
  if (/(anunci|promo|campaña|lancemos|hagamos|quiero|descuento|precio|sub)/.test(t)) return 'Anotado. Si cabe en tu tope lo hago hoy; si cuesta plata nueva, te lo propongo con números.'
  return 'Anotado. Pauso el anuncio de ese plato hoy mismo y te lo confirmo mañana a las 9:00.'
}
const maxDay = Math.max(...D.days.now, ...D.days.prev)

function App() {
  const orbCanvas = useRef(null), orb = useRef(null)
  const [bootDone, setBootDone] = useState([false, false, false, false])
  const [activated, setActivated] = useState(false)
  const [voice, setVoice] = useState('off')
  const [paused, setPaused] = useState(false)
  const [lines, setLines] = useState([])
  const [log, setLog] = useState(D.done)
  const [undone, setUndone] = useState({})
  const [step, setStep] = useState(-1)
  const [shown, setShown] = useState('')
  const [pending, setPending] = useState(null)
  const [resolved, setResolved] = useState({})
  const [stage, setStage] = useState(null)
  const [tour, setTour] = useState(null)
  const [boards, setBoards] = useState(null)
  const [saved, setSaved] = useState([])
  const bootShown = Math.round(bootDone.filter(Boolean).length / BOOT_STEPS.length * 100)
  const bootReady = bootDone.every(Boolean)

  useEffect(() => { BOOT_STEPS.forEach((_, i) => setTimeout(() => setBootDone(d => d.map((x, j) => j <= i ? true : x)), 420 * (i + 1))) }, [])
  useEffect(() => { if (!orbCanvas.current) return; orb.current = createOrb(orbCanvas.current); return () => orb.current && orb.current.destroy() }, [])
  useEffect(() => { orb.current && orb.current.setState(voice === 'off' ? 'off' : voice) }, [voice])

  const say = (text, err) => setLines(l => [...l.slice(-3), { id: Date.now() + Math.random(), text, err }])
  const note = (what, why) => setLog(l => [{ id: 'n' + Date.now(), when: 'hoy', what, why, undo: false }, ...l])
  const activate = () => {
    if (activated) return
    setActivated(true)
    let seen = false
    try { seen = localStorage.getItem('evo-guia-vista') === '1'; localStorage.setItem('evo-guia-vista', '1') } catch (e) {}
    if (!seen) setTimeout(() => setTour(TOUR[0].target), 700)
  }
  const help = id => { setBoards(null); setTour(id) }
  const openBoards = initial => { setTour(null); setBoards({ initial }) }
  const saveBoard = b => setSaved(l => l.some(x => x.id === b.id) ? l : [...l, b])

  useEffect(() => {
    if (step < 0) return
    const text = D.voice[step]; let i = 0; setShown(''); setVoice('speaking'); setPending(null)
    const t = setInterval(() => { i += 3; setShown(text.slice(0, i)); if (i >= text.length) { clearInterval(t); setVoice('listening'); if (step >= 1) setPending(D.decisions[step - 1]); else setTimeout(() => setStep(1), 1800) } }, 22)
    return () => clearInterval(t)
  }, [step])
  const startReview = () => { if (!activated) { activate(); return } setStep(0) }
  const next = () => { if (step < D.voice.length - 1) setStep(step + 1); else { setShown('Listo. Te mando el resumen por WhatsApp. Mañana a las 9:00 te cuento el primer día con los cambios.'); setVoice('off'); setStep(-1); setPending(null) } }
  const decide = (d, ok, fromReview) => {
    setResolved(r => ({ ...r, [d.id]: ok ? 'ok' : 'no' }))
    say(ok ? `✓ aprobado: ${d.title}` : `○ queda para después: ${d.title}`)
    if (ok) note(d.title, 'Lo aprobaste hoy. Te cuento mañana cómo fue.')
    if (fromReview) { setPending(null); setTimeout(next, 400) }
  }
  const undo = a => { setUndone(u => ({ ...u, [a.id]: true })); say(`↺ deshecho: ${a.what}`); note(`Deshice: ${a.what}`, 'Lo pediste tú. Vuelve a como estaba.') }
  const togglePause = () => { const p = !paused; setPaused(p); say(p ? '■ anuncios en pausa: no se gasta un sol más hasta que digas' : '▶ anuncios reanudados'); note(p ? 'Pausaste todos los anuncios' : 'Reanudaste los anuncios', p ? 'Meta y Google detenidos.' : 'Meta y Google activos.') }
  const ask = text => {
    say(`» «${text}»`)
    const t = text.toLowerCase()
    if (/(explíca|explica|guía|guia|ayuda|no entiendo|qué es esto|que es esto)/.test(t)) { setTimeout(() => { say('Te muestro la pantalla por partes.'); setTour(TOUR[0].target) }, 400); return }
    if (/(tablero|muéstrame|muestrame|gráfic|grafic|¿|\?)/.test(t) || BOARDS.some(b => b.match.test(t))) { setTimeout(() => { say('Te armo un tablero con eso.'); openBoards(text) }, 400); return }
    setTimeout(() => say(classify(text)), 500)
  }
  const pendingCount = D.decisions.filter(d => !resolved[d.id]).length

  const coreText = paused ? 'EN PAUSA' : voice === 'speaking' ? 'HABLANDO' : voice === 'listening' ? 'TE ESCUCHO' : 'TRABAJANDO'
  const cmdText = step >= 0 ? (voice === 'speaking' ? 'EVO HABLA…' : 'ELIGE ARRIBA') : 'ESCUCHAR EL RESUMEN'

  return (
    <div className="evo-hud" data-voice-state={voice}>
      <div className="crt" aria-hidden="true"><div className="scanline" /></div>

      <header className="topbar">
        <div className="brand"><div className="brand-ring"><MicIcon /></div><div><h1 className="brand-name">EVO</h1><p className="brand-sub">{D.brand} · {D.week}</p></div></div>
        <div className="head-actions">
          <button type="button" id="btn-guide" className="listen-pill" onClick={() => help(TOUR[0].target)} aria-label="Guíame por la pantalla"><span>?<span className="pl"> GUÍAME</span></span></button>
          <button type="button" id="btn-boards" className="listen-pill" onClick={() => openBoards()}><span>▦<span className="pl"> TABLEROS</span>{saved.length ? ` · ${saved.length}` : ''}</span></button>
          <button type="button" id="btn-pause" className={`listen-pill ${paused ? 'muted' : 'stop'}`} onClick={togglePause}><span className="pdot square" aria-hidden="true" /><span>{paused ? 'REANUDAR' : 'PAUSAR TODO'}</span></button>
          <button type="button" className={`listen-pill state-${voice}`} onClick={startReview}><span className="pdot" aria-hidden="true" /><span>{pendingCount ? `${pendingCount} POR APROBAR` : 'TODO APROBADO'}</span></button>
          <div className="head-sep" aria-hidden="true" />
          <div className="operator"><span>{D.operator}</span><div className="avatar" aria-hidden="true" /></div>
        </div>
      </header>

      <section className="kpis" id="head-metrics" aria-label="Las tres cifras de la semana">
        {D.top.map(m => <div className="kpi" key={m.label}><span className="kpi-label">{m.label}</span><span className="kpi-value">{paused && m.label.startsWith('Vendiste') ? 'EN PAUSA' : m.value}</span><span className={`kpi-delta ${m.good ? 'good' : ''}`}>{m.delta}</span></div>)}
      </section>

      <main className="grid3">
        <div className="col">
          <Panel onHelp={help} id="p-plata" name="TU PLATA" tag="NOVIEMBRE">
            <div className="metric-row"><div><div className="m-label">Gastaste este mes · tope S/ {D.month.cap.toLocaleString('es-PE')}</div><div className="m-big">S/ {D.month.spent}</div></div><svg className="m-icon" viewBox="0 0 40 20" aria-hidden="true"><polyline points="0,10 8,10 12,3 17,17 21,7 25,10 40,10" fill="none" stroke="currentColor" strokeWidth="1.5" /></svg></div>
            <div className="bar"><div className="bar-fill" style={{ width: `${D.month.spent / D.month.cap * 100}%` }} /></div>
            <div className="m-label">Ventas por día · esta semana y la anterior</div>
            <div className="week-bars" aria-hidden="true">{D.days.now.map((n, i) => <div key={i}><i className="prev" style={{ height: `${D.days.prev[i] / maxDay * 100}%` }} /><i style={{ height: `${n / maxDay * 100}%`, opacity: paused ? .3 : 1 }} /></div>)}</div>
            <div className="days" aria-hidden="true">{['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((d, i) => <span key={i}>{d}</span>)}</div>
          </Panel>
          <Panel onHelp={help} id="p-canales" name="DÓNDE RINDE" tag="POR PLATAFORMA" bodyClass="ctx-cards">
            {D.channels.map(c => <div className="ctx-row" key={c.name}><div className="ctx-top"><span className="ctx-title">{c.name}</span><span className="ctx-value">{c.cpo}</span></div><div className="ctx-detail">vendido · {c.spent} invertido · {c.orders} pedidos</div><div className="rank"><i style={{ width: `${c.orders / 52 * 100}%` }} /></div><div className="rec">{c.rec}</div></div>)}
          </Panel>
          <Panel onHelp={help} id="p-alertas" name="ALERTAS" tag={`${D.alerts.length} ÁMBAR · 0 ROJAS`} className="grow" bodyClass="log">
            {paused && <div className="hap warn"><span className="hap-title">ANUNCIOS EN PAUSA</span><span className="hap-detail">No se gasta nada hasta que los reanudes.</span></div>}
            {D.alerts.map(a => <div className={`hap ${a.level}`} key={a.title}><span className="hap-title">{a.title}</span><span className="hap-detail">{a.detail}</span></div>)}
          </Panel>
        </div>

        <div className="core-col" id="core-col">
          <span className="corner tl" aria-hidden="true" /><span className="corner tr" aria-hidden="true" /><span className="corner bl" aria-hidden="true" /><span className="corner br" aria-hidden="true" />
          <div className="core-stage" aria-hidden="true">
            <canvas className="orb3d" ref={orbCanvas} />
            <div className="hud-ring r-dash" /><div className="hud-ring r-solid"><span className="tick t-top" /><span className="tick t-bot" /></div><div className="hud-ring r-inner" />
            <div className="cross x1" /><div className="cross x2" /><div className="cross x3" /><div className="blip b1" /><div className="blip b2" />
            <div className="core"><span className="core-state">EVO<br />{coreText}</span></div>
          </div>
          <div className="core-dock">
            {shown && <p className="evo-line" aria-live="polite"><b>EVO</b>{shown}</p>}
        {pending && activated && <div className="approvals" aria-live="polite"><div className="approval"><div className="approval-title">Necesita tu OK</div><pre>{`${pending.title}\n${pending.why} Estimo ${pending.gain}.\nConfianza ${pending.conf}. ${pending.cost}`}</pre><div className="approval-actions"><button type="button" className="approve" onClick={() => decide(pending, true, true)}>✅ Aprobar</button><button type="button" className="deny" onClick={() => decide(pending, false, true)}>○ Ahora no</button><span className="approval-note">Nada sube de presupuesto sin tu OK.</span></div></div></div>}
            <div className="vu" aria-hidden="true">{Array.from({ length: 16 }, (_, i) => <i key={i} style={{ height: voice === 'speaking' ? `${20 + ((i * 37) % 70)}%` : '12%' }} />)}</div>
            <button type="button" className="cmd-pill" aria-live="polite" onClick={startReview}><MicIcon size={13} /><span className="cmd-label">{cmdText}</span></button>
            <div className="dock-input terminal"><CommandInput label="dock" disabled={!activated} placeholder="cuéntale algo a Evo: se acabó el juane" onSubmit={ask} /></div>
          </div>
        </div>

        <div className="col">
          <Panel onHelp={help} id="p-semana" name="LA SEMANA" tag="CONTRA LA ANTERIOR">
            {D.six.map(([k, v, prev]) => <div className="kpi-row" key={k}><span>{k}</span><span><b>{v}</b><em>{prev}</em></span></div>)}
            <button type="button" className="mini-btn" onClick={() => openBoards()}>▦ PEDIR UN TABLERO</button>
          </Panel>
          <Panel onHelp={help} id="p-hice" name="LO QUE HICE" tag="CON SU MOTIVO" className="grow" bodyClass="log">
            {log.map(a => <div className="hap" key={a.id}><span className="hap-time">[{a.when}]</span><span className="hap-title">{undone[a.id] ? '↺ ' : ''}{a.what}</span><span className="hap-detail">{a.why}</span>{a.undo && !undone[a.id] && <button type="button" className="mini-btn" onClick={() => undo(a)}>DESHACER</button>}</div>)}
          </Panel>
          <Panel onHelp={help} id="p-aprobar" name="POR APROBAR" tag={`${pendingCount} PENDIENTES`}>
            <div>
              {D.decisions.map(d => <div className="dec" key={d.id}><b>{resolved[d.id] === 'ok' ? '✓ ' : resolved[d.id] === 'no' ? '○ ' : ''}{d.title}</b>{d.why} {d.gain}.<div className="conf">CONFIANZA <b className={d.conf}>{d.conf.toUpperCase()}</b> · {d.cost}</div>{!resolved[d.id] && <div><button type="button" className="mini-btn ok" onClick={() => decide(d, true)}>APROBAR</button><button type="button" className="mini-btn" onClick={() => decide(d, false)}>AHORA NO</button></div>}</div>)}
            </div>
            <div className="terminal" aria-live="polite">
              {lines.map(l => <div key={l.id} className={`t-line ${l.err ? 'err' : ''}`}>{l.text}</div>)}
              <CommandInput label="term" disabled={!activated} placeholder="cuéntale algo o pregúntale a Evo" onSubmit={ask} />
            </div>
          </Panel>
        </div>
      </main>

      <footer className="botbar">
        <div className="foot-l"><span className={`foot-chip ${paused ? '' : 'on'}`}>{paused ? '■ ANUNCIOS EN PAUSA' : '● ANUNCIOS ACTIVOS'}</span><span className="foot-chip">META + GOOGLE</span><span className="foot-chip">NADA SUBE DE PRESUPUESTO SIN TU OK</span><span className="foot-chip">GARANTÍA: CLARIDAD Y 3× TU PAUTA A LOS 60 DÍAS</span></div>
        <div className="foot-r"><span>SOPORTE · EQUIPO EVO · MENOS DE 8 H</span></div>
      </footer>

      {stage && <div className="stage-overlay" role="dialog" aria-label={stage.title}><div className="stage-body"><h3>{stage.title}</h3>{stage.body.map(([k, v]) => <p key={k}><strong>{k}</strong><br />{v}</p>)}<div className="note">En la app real cada línea abre su detalle. Nunca verás impresiones, alcance ni clics sueltos.</div></div><div className="stage-title">{stage.title}</div><button type="button" className="stage-close" onClick={() => setStage(null)}>✕ CERRAR</button></div>}

      {boards && <Boards initial={boards.initial} saved={saved} onSave={saveBoard} onClose={() => setBoards(null)} say={say} />}
      {tour && <Tour key={tour} start={tour} onClose={() => setTour(null)} />}


      <div className={`activate ${activated ? 'gone' : ''}`} onClick={activate} role="button" tabIndex={activated ? -1 : 0} aria-label="Activar Evo" onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate() } }}>
        <div className="boot">
          <div className="boot-head"><span>INICIALIZANDO<span className="boot-dots" /></span><span className="boot-pct">{bootShown}%</span></div>
          <div className="boot-bar"><div className="boot-fill" style={{ width: `${bootShown}%` }} /></div>
          <div className="boot-cols"><div className="boot-log">{BOOT_STEPS.map((s, i) => <div key={s} className={bootDone[i] ? 'done' : ''}>{s}</div>)}</div><div className="boot-tags"><div>{D.operator}</div><div>EVO</div><div>LIMA, PERÚ</div></div></div>
          {bootReady && <div className="boot-ready">TOCA PARA ENTRAR</div>}
          {bootReady && <div className="boot-note">DEMOSTRACIÓN CON DATOS DE EJEMPLO · LA VOZ REAL VIVE EN LA APP</div>}
        </div>
        <div className="boot-credit">{D.brand}</div>
      </div>
    </div>
  )
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />)
</script>

</body></html>
